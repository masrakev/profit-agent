[project]
name = "profit-agent"
version = "0.1.0"
description = "Verifiable AI profit analyst for e-commerce stores"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13",
    "numpy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0.30",
    "structlog>=24.1",
]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.10",
    "pip-audit>=2.7",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app", "bench"]

[tool.hatch.build]
dev-mode-dirs = ["backend", "."]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend", "."]
extend-exclude = ["tasks", "notes"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RUF", "DTZ", "PT", "N"]
ignore = [
    "S101",   # assert is fine in tests and for internal invariants
    "S608",   # SQL is built from internal constants only, never from user input
    "RUF001", # the verifier intentionally contains unicode look-alike characters
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["S105", "S106", "S311", "N802"]
"backend/migrations/**" = ["N999"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "backend:."
packages = ["app", "bench"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend", "."]
addopts = "-ra --strict-markers --cov=app.facts --cov=app.verifier --cov=app.causes --cov-report=term-missing --cov-fail-under=90"
markers = ["db: requires a running PostgreSQL (see docker-compose.yml)"]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
