# Detector thresholds. The only place detection numbers live; bump `version` on any change.
# Tuned on the `dev` benchmark suite only (see docs/adr/0005-detectors.md).
version = 1

[robust_z]
# Daily values against the trailing `baseline_days` (median and 1.4826 * MAD).
baseline_days = 28
threshold = 3.5        # |z| needed on a day
persist_days = 3       # consecutive days above threshold before the symptom fires
rel_floor = 0.02       # scale floor relative to the baseline median (stable ratios, costs)
abs_floor = 1e-9

[cusum]
# Daily standardized values against a fixed reference period (slow drifts).
reference_start_day = 7        # skip the first week of an entity's data
reference_days = 28
current_days = 7               # window of the facts reported for a CUSUM symptom
k = 0.5                        # allowance, in sigmas
h = 8.0                        # decision interval
abs_floor = 1e-9

[campaign_cpa]
min_reference_purchases = 30   # attributed purchases in the reference period
cusum_k = 0.25                 # allowance of the purchases CUSUM: small drifts accumulate (the
                               # materiality gate keeps noise-driven campaign incidents off alerts)

[product_units]
min_baseline_units = 5         # daily units, baseline median
threshold = 4.0

[product_unit_cost]
rel_floor = 0.01

[product_unit_fee]
rel_floor = 0.01

[store_payment_fee_rate]
rel_floor = 0.01
cusum_k = 0.5
cusum_h = 8.0

[store_gross_margin_rate]
rel_floor = 0.005
cusum_k = 0.25
cusum_h = 12.0

[campaign_profit]
window_days = 14
persist_days = 3
min_loss_ratio = 0.0           # fires when profit < -min_loss_ratio * spend

[inventory_cover]
persist_days = 4
spend_window_days = 7          # the product must have promoting spend in this window

[refund_rate]
# Refunds per order line in the window vs the product's history since the warm-up
# (conditional binomial test, which accounts for the baseline's own noise).
window_days = 14
baseline_days = 28             # minimum history before the window
warmup_days = 21               # refunds lag sales by up to 20 days: skip the first weeks
lag_min_days = 2               # refunds arrive 2-20 days after the sale: exposure of a day is the
lag_max_days = 20              # average lines sold over that lag range before it
ratio = 1.5                    # current rate >= ratio * baseline rate ...
alpha = 0.001                  # ... and conditional binomial p < alpha
min_baseline_rate = 0.01
persist_days = 3

[attribution_collapse]
# Tracking break: an abrupt step of attributed purchases per click (see detectors.py).
lookback_days = 56             # change point searched in the last 56 days (data up to today)
min_before_days = 14           # at least 14 days before the change point ...
abrupt_days = 5                # ... and the rate already collapsed within 5 days after it
change_point_guard_days = 1    # ... skipping 1 day each side of the change point (location error)
baseline_days = 28             # baseline: up to 28 days ending at the change point
max_ratio_of_baseline = 0.5    # conversion per click below half its baseline, and right after
                               # the change point below half of the days just before it,
stable_before_ratio = 0.75     # ... which were still >= 75% of the baseline (a step, not a ramp),
min_purchases_before = 10      # ... with at least 10 purchases in those days (enough to tell),
clicks_tolerance = 0.25        # ... clicks within 25% of baseline (still delivering),
orders_stable_tolerance = 0.15 # ... promoted revenue moves less than this ...
max_explained_share = 0.3      # ... and fell by less than 30% of the attributed revenue drop,
explained_noise_sigmas = 1.0   # ... give or take 1 sigma of sales noise,
min_drop_sigmas = 2.0          # ... which itself exceeds 2 sigma of the promoted sales
persist_days = 5

[incrementality]
window_days = 14
baseline_days = 28
min_rise = 0.35                # attributed purchases up at least 35% vs baseline ...
sales_flat_tolerance = 0.10    # ... while promoted units move less than 10%
min_baseline_purchases = 30
persist_days = 5

[severity]
medium = 1.5                   # score / threshold
high = 3.0
score_cap = 3.0                # cap per symptom when ranking root causes

[incidents]
gap_days = 7                   # symptoms within this many days of each other overlap in time

[attribution]
# Baseline: the weeks before the incident (ending `pre_incident_gap_days` before it was first
# seen); current: the same number of weeks at the end of the data.
min_window_days = 14
max_window_days = 42
pre_incident_gap_days = 7
bonus = 1.5                    # added to the candidate matching the largest negative driver
min_driver_share = 0.25        # ... when it explains at least this share of the profit drop

[noise_band]
# Normal variation of each profit driver between equal-length healthy windows of the store's
# history (adjacent pairs stepping by a week; seeded block bootstrap with 7-day blocks when the
# history gives fewer than `min_pairs` pairs). Outside P5-P95 = significant.
resamples = 500
min_pairs = 20
low_percentile = 5.0
high_percentile = 95.0

[multiple_testing]
# Benjamini-Hochberg across products, per detector and evaluation day (units, unit cost, unit fee
# and refund tests). A day counts only if its test survives at this false discovery rate AND
# meets the detector's own threshold; persistence rules then apply as usual.
fdr = 0.05

[materiality]
# Expected monthly impact of an incident: seeded block bootstrap (7-day blocks) of its Shapley
# contributions over the current window. The thresholds themselves are store settings
# (absolute and relative materiality, see app/settings).
resamples = 500
